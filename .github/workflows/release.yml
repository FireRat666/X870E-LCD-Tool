name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --verbose

      - name: Package release artifacts
        run: |
          mkdir -p release_package
          cp target/release/x870e-lcd-stream release_package/
          cp target/release/x870e-lcd-patcher release_package/
          cp target/release/x870e-lcd-flash release_package/
          cp target/release/x870e-lcd release_package/
          cp target/release/x870e-lcd-gui release_package/
          cp README.md release_package/

          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ] || [ "$TAG" = "video-streaming" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi

          ARCHIVE_NAME="x870e-lcd-tools-linux-x86_64-${TAG}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C release_package .
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Create and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            x870e-lcd-tools-linux-x86_64-*.tar.gz
            x870e-lcd-tools-linux-x86_64-*.sha256
            target/release/x870e-lcd-stream
            target/release/x870e-lcd-patcher
            target/release/x870e-lcd-flash
            target/release/x870e-lcd
            target/release/x870e-lcd-gui
