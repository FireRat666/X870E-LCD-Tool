[workspace]
resolver = "2"
members = [
    "crates/x870e-lcd-core",
    "crates/x870e-lcd-cli",
    "crates/x870e-lcd-gui",
    "crates/x870e-lcd-patcher",
    "crates/x870e-lcd-flash",
    "crates/x870e-lcd-stream",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FireRat"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FireRat666/X870E-LCD-Tool"

[workspace.dependencies]
rusb = "0.9"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
sysinfo = "0.33"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"
